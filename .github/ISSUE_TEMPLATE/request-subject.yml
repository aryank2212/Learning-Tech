name: Request a subject or topic
description: Ask for a new subject, or a new topic inside an existing one.
title: "[Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: You can ask for anything. A clear request helps us build the right thing.
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
      description: Name the subject or topic, and what you'd like to learn from it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
      description: Your goal helps us choose the right depth.
  - type: dropdown
    id: level
    attributes:
      label: Your current level
      options:
        - Beginner
        - Some experience
        - Experienced
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'd like to write part of it myself
