name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # every Monday, for the external link check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure-and-links:
    name: Structure and internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the repository checks
        run: python scripts/check_repo.py

  sklearn-examples:
    name: scikit-learn and ONNX examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run the lightweight examples
        # The PyTorch and TensorFlow examples download large wheels, so they are tested by hand.
        run: |
          for f in ai/frameworks/scikit-learn/examples/*.py; do
            echo "== $f"; uv run "$f"
          done
          uv run ai/frameworks/ml-libraries-other-languages/examples/01_sklearn_to_onnx.py

  external-links:
    name: External links (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 25
            --accept "100..=103,200..=299,403,406,429"
            --exclude "localhost" --exclude "example.com"
            "**/*.md"
          fail: false
